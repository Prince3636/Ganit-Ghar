<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradients & Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="12" dy="14" stdDeviation="0" flood-color="#10263a" flood-opacity="1"/>
    </filter>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c8dff" />
      <stop offset="100%" stop-color="#2ec4b6" />
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff4cc" />
      <stop offset="100%" stop-color="#ffd23f" />
    </linearGradient>
  </defs>

  <!-- Outer Squircle with Chunky Border and Shadow -->
  <rect x="28" y="28" width="456" height="456" rx="96" ry="96" fill="url(#bgGrad)" stroke="#10263a" stroke-width="16" filter="url(#shadow)"/>

  <!-- Math Graph Grid lines inside -->
  <path d="M28 140 H484 M28 256 H484 M28 372 H484 M140 28 V484 M256 28 V484 M372 28 V484" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" stroke-dasharray="8 8"/>

  <!-- Center Slanted Math Tile -->
  <g transform="rotate(-6, 256, 256)">
    <rect x="110" y="110" width="292" height="292" rx="54" ry="54" fill="url(#tileGrad)" stroke="#10263a" stroke-width="14" filter="url(#shadow)"/>
    
    <!-- Pi Symbol & Symbols -->
    <text x="256" y="295" text-anchor="middle" font-family="'Lexend', 'Trebuchet MS', system-ui, sans-serif" font-weight="900" font-size="180" fill="#10263a">π</text>
    
    <!-- Little Math Operations floating around Pi -->
    <text x="160" y="175" font-family="sans-serif" font-weight="900" font-size="38" fill="#ff6b62">+</text>
    <text x="330" y="180" font-family="sans-serif" font-weight="900" font-size="38" fill="#4c8dff">×</text>
    <text x="160" y="365" font-family="sans-serif" font-weight="900" font-size="38" fill="#2fbf85">÷</text>
    <text x="330" y="365" font-family="sans-serif" font-weight="900" font-size="38" fill="#ff9d3d">−</text>
  </g>

  <!-- Golden Stars of achievement -->
  <g transform="translate(68, 68)">
    <polygon points="25,2 32,18 49,18 35,29 40,46 25,35 10,46 15,29 1,18 18,18" fill="#ffd23f" stroke="#10263a" stroke-width="4"/>
  </g>
  <g transform="translate(390, 80) scale(0.85)">
    <polygon points="25,2 32,18 49,18 35,29 40,46 25,35 10,46 15,29 1,18 18,18" fill="#ffd23f" stroke="#10263a" stroke-width="4"/>
  </g>
  <g transform="translate(395, 380) scale(0.9)">
    <polygon points="25,2 32,18 49,18 35,29 40,46 25,35 10,46 15,29 1,18 18,18" fill="#ffd23f" stroke="#10263a" stroke-width="4"/>
  </g>
</svg>
