name: Build Ganit Ghar Android APK & Play Console AAB

on:
  # ONLY run when manually triggered via script or GitHub Actions "Run workflow" button
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-artifacts:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Web Assets
        run: npm run build

      - name: Sync Capacitor Android & Launcher Icons
        run: |
          npx cap sync android
          node scripts/prepare-android.js

      - name: Grant Execute Permission to Gradle Wrapper
        working-directory: android
        run: chmod +x gradlew

      - name: Build Android Debug APK (For Direct Phone Testing)
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Android Release App Bundle AAB (For Google Play Console)
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload Android APK Artifact (Direct Install on Mobile)
        uses: actions/upload-artifact@v4
        with:
          name: GanitGhar-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Play Console AAB Artifact (Google Play Store Release)
        uses: actions/upload-artifact@v4
        with:
          name: GanitGhar-PlayConsole-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
